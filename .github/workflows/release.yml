name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. patch, minor, major, or explicit like 1.0.0). Leave empty to compute it from conventional commits: while the package is 0.x, a breaking change gives a minor and anything else a patch.'
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - run: yarn install

      - name: Release
        run: yarn release --ci ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
